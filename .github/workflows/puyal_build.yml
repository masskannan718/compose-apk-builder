name: PUYAL v7.0 Omni-Hardened APK Engine

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Android App Display Name'
        required: true
        default: 'PuyalApp'
      package_name:
        description: 'Android Package ID'
        required: true
        default: 'com.puyal.app'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ☕ Set up JDK 17 (Golden Standard)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android SDK Licenses & Environment Setup
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 📦 Synthesize Golden Master Android Project Structure
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          PKG_NAME="${{ github.event.inputs.package_name }}"
          PKG_PATH=$(echo $PKG_NAME | tr '.' '/')

          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. gradle.properties
          cat << 'PEOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PEOF

          # 2. Root build.gradle
          cat << 'GEOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          GEOF

          # 3. settings.gradle
          cat << 'SEOF' > settings.gradle
          rootProject.name = "PuyalAutonomous"
          include ':app'
          SEOF

          # 4. app/build.gradle
          cat << AEOF > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "${PKG_NAME}"
              compileSdk 34

              defaultConfig {
                  applicationId "${PKG_NAME}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          AEOF

          # 5. AndroidManifest.xml
          cat << MEOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="${APP_NAME}"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MEOF

          # 6. Strings & Colors
          cat << REOF > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          REOF

          # 7. Activity Layout XML
          cat << 'LEOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:background="#0f172a">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🌪️ Puyal v7.0 Engine Online"
                  android:textColor="#38bdf8"
                  android:textSize="20sp"
                  android:textStyle="bold" />
          </RelativeLayout>
          LEOF

          # 8. MainActivity Java
          cat << JEOF > app/src/main/java/$PKG_PATH/MainActivity.java
          package ${PKG_NAME};

          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          JEOF

      - name: 🔨 Initialize Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: 🚀 Compile Production Release APK
        run: |
          ./gradlew assembleRelease --no-daemon -Pandroid.suppressUnsupportedCompileSdk=34

      - name: 🔑 100% Valid Auto-Keystore & apksigner
        run: |
          BUILD_TOOLS="/usr/local/lib/android/sdk/build-tools/34.0.0"
          APK_RAW="app/build/outputs/apk/release/app-release-unsigned.apk"

          # கீஸ்டோர் இல்லையென்றால் உடனடியாக வாலிட் சான்றிதழை உருவாக்குதல்
          keytool -genkey -v -keystore release.keystore -alias puyalkey -keyalg RSA -keysize 2048 -validity 10000 -storepass puyalpass -keypass puyalpass -dname "CN=Puyal, OU=Mobile, O=PuyalDev, L=Chennai, S=TN, C=IN"

          # Zipalign செய்தல்
          $BUILD_TOOLS/zipalign -v -p 4 $APK_RAW puyal_aligned.apk

          # V2/V3 ஆபிஷியல் ஆண்ட்ராய்டு கையொப்பம் இடுதல்
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:puyalpass --ks-key-alias puyalkey --key-pass pass:puyalpass --out puyal_signed.apk puyal_aligned.apk

          # கையொப்பத்தை உறுதி செய்தல்
          $BUILD_TOOLS/apksigner verify --verbose puyal_signed.apk

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puyal-release-apk
          path: puyal_signed.apk
          retention-days: 7
