name: "Puyal v5.3 Zero-Compute Cloud Engine"

on:
  repository_dispatch:
    types: [puyal_trigger]
  workflow_dispatch:
    inputs:
      route:
        description: "Select Pipeline Route (ROUTE_BUILD or ROUTE_CRYPT)"
        required: true
        default: "ROUTE_CRYPT"

jobs:
  puyal_ephemeral_worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout Ephemeral Workspace"
        uses: actions/checkout@v4

      - name: "Install Cloud Core: Rclone Engine"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: "Restore Secure Dual-Vault Credentials"
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      # ROUTE A: PUBLIC BUILDS / ANDROID APK -> GOOGLE DRIVE 5TB
      - name: "Execute Route A: Google Drive 5TB Delivery"
        if: ${{ github.event.client_payload.route == 'ROUTE_BUILD' || github.event.inputs.route == 'ROUTE_BUILD' }}
        run: |
          echo "[-] Routing Artifacts to Google Drive 5TB..."
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          mkdir -p /tmp/artifacts
          echo "Puyal Cloud Build Success - ${TIMESTAMP}" > /tmp/artifacts/build_output_${TIMESTAMP}.txt
          rclone copy /tmp/artifacts/ puyal_drive:puyal_builds/ --buffer-size 0M -q
          echo "ROUTE_A_COMPLETED=true" >> $GITHUB_ENV

      # ROUTE B: CORE SOURCE CODE -> MEGA 20GB AES-256 CRYPT
      - name: "Execute Route B: MEGA 20GB AES-256 Crypt Delivery"
        if: ${{ github.event.client_payload.route == 'ROUTE_CRYPT' || github.event.inputs.route == 'ROUTE_CRYPT' || (github.event.client_payload.route == '' && github.event.inputs.route == '') }}
        run: |
          echo "[-] Routing Encrypted Source Code to MEGA 20GB Vault..."
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          mkdir -p /tmp/crypt_blobs
          echo "Puyal Source Code Master Vault Archive - ${TIMESTAMP}" > /tmp/crypt_blobs/master_source_${TIMESTAMP}.txt
          rclone copy /tmp/crypt_blobs/ puyal_crypt: --buffer-size 0M -q
          echo "ROUTE_B_COMPLETED=true" >> $GITHUB_ENV

      # PURGE / AUTO-SANITIZATION (ZERO-DATA RETENTION)
      - name: "Sanitize Ephemeral Cloud Workspace"
        if: always()
        run: |
          echo "[-] Shredding ephemeral credentials and payloads..."
          shred -u -z ~/.config/rclone/rclone.conf || rm -f ~/.config/rclone/rclone.conf
          rm -rf /tmp/artifacts /tmp/crypt_blobs
          echo "Ephemeral Cloud Runner Cleaned (Zero-Trace)."
