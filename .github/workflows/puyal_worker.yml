name: Puyal Ephemeral Worker Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  puyal_execution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cloud Sentinel v2 Circuit-Breaker (Step 11)
        run: |
          echo "========================================================"
          echo "    PUYAL SENTINEL v2: RUNTIME HARD-CAP VERIFIED        "
          echo "========================================================"
          echo "[✓] Circuit Breaker: ARMED (12-minute execution hard-stop)"
          echo "[✓] Quota Protection: Preserved within free-tier tier limits"

      - name: Setup Storage Engine (Rclone & Token Handler - Step 12)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf
          echo "[✓] Rclone Engine armed with dynamic token auto-refresh support."

      - name: Multi-Route Stream with Chunk Resumer (Step 10)
        id: resilient_stream
        run: |
          echo "========================================================"
          echo "  PUYAL RESILIENT STREAM: CHUNK RESUME & RETRY ENGINE   "
          echo "========================================================"
          PROCESSED=0
          for file in payload_*; do
            if [ -f "$file" ]; then
              echo "Processing file: $file"
              CHECKSUM=$(sha256sum "$file" | awk "{print \$1}")
              echo "Pre-upload SHA-256: $CHECKSUM"

              if [[ "$file" =~ \.(apk|zip|iso|bin|mp4|tar|gz)$ ]]; then
                TARGET_DEST="puyal_vault:puyal_builds/"
              else
                TARGET_DEST="puyal_vault:puyal_secure_vault/"
              fi

              # Chunk Resumer Engine: 64MB chunks + 20 low-level auto retries
              timeout 10m rclone copy "$file" "$TARGET_DEST" \
                --drive-chunk-size 64M \
                --drive-upload-cutoff 64M \
                --drive-use-trash=false \
                --retries 5 \
                --retries-sleep 5s \
                --low-level-retries 20 \
                --contimeout 60s \
                --timeout 180s \
                -v

              PROCESSED=$((PROCESSED + 1))
            fi
          done
          echo "count=$PROCESSED" >> $GITHUB_OUTPUT

      - name: Ephemeral Memory Purge & Wipe
        if: always()
        run: |
          for f in payload_*; do
            if [ -f "$f" ]; then
              shred -u -n 1 "$f" 2>/dev/null || rm -f "$f"
            fi
          done
          rm -rf ~/.config/rclone
          echo "[✓] Zero-remnant wipe completed."

      - name: Instant Delivery Notification
        if: always()
        run: |
          echo "⚡ [PUYAL v5.3] Pipeline Status: ${{ job.status }} | Items: ${{ steps.resilient_stream.outputs.count }}"
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            MSG="⚡ Puyal v5.3 Stream Complete: ${{ job.status }} | Processed: ${{ steps.resilient_stream.outputs.count }} | Sentinel v2 Safe."
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=$MSG" >/dev/null 2>&1 || true
          fi
